[project]
name = "rag-pinecone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "swapnilm1987-gif", email = "swapnilm1987@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=7.3.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
rag-pinecone = "rag_pinecone:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
